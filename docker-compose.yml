services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: inmobiliaria_db
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: plataforma_inmobiliaria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plataforma_inmobiliaria"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - inmobiliaria

  backend:
    container_name: inmobiliaria_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:mysecretpassword@postgres:5432/plataforma_inmobiliaria?schema=public
      JWT_SECRET: dev-secret-change-in-production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inmobiliaria

  frontend:
    container_name: inmobiliaria_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_URL: http://backend:3001
      JWT_SECRET: dev-secret-change-in-production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - inmobiliaria

networks:
  inmobiliaria:

volumes:
  pgdata:
